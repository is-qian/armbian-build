# Rockchip RK3566 quad core 1GB RAM USB-C
# Microduck board configuration, first version: bring-up image
BOARD_NAME="Microduck"
BOARD_VENDOR="seeed-studio"
BOARDFAMILY="rk35xx"
BOARD_MAINTAINER="Microduck Team"
INTRODUCED="2026"
# Reuse the Radxa ZERO 3 vendor U-Boot defconfig as an initial development
# baseline. It has only been validated on Radxa ZERO 3; Microduck hardware is
# not yet available and still requires first-board bring-up validation.
BOOTCONFIG="radxa-zero3-rk3566_defconfig"
KERNEL_TARGET="vendor"
KERNEL_TEST_TARGET="vendor"
EXTRAWIFI="no"
FULL_DESKTOP="no"
BOOT_LOGO="none"
BOOT_FDT_FILE="rockchip/rk3566-microduck.dtb"
IMAGE_PARTITION_TABLE="gpt"
BOOT_SCENARIO="spl-blobs"

# WQ9201S SDIO WiFi + UART BT (WL6201S module), same stack as the
# reComputer RK3576 Module Dev Kit: DKMS driver + firmware from the Seeed
# APT repo; BT attaches via btattach H4 on ttyS1 (UART1_M0), handled by the
# package's wq9201s-bt.service.
PACKAGE_LIST_BOARD="rfkill bluetooth bluez bluez-tools"

# Same Seeed vendor setup as the reComputer RK3576 Module Dev Kit: APT repo
# helper plus board tweaks (USB gadget defaults, automount, etc. kept on).
# fcs960k-aic-bluez would replace bluez and break WQ9201S BT; morse tools
# target hardware this board does not have. Same disables as the module
# devkit.
SEEED_AIC_BLUEZ_ENABLE="no"
SEEED_MORSE_ENABLE="no"
source "${SRC}/config/sources/vendors/seeed-studio/recomputer-rk35xx-common.inc"

# Use the Microduck kernel branch from the local linux-rockchip checkout,
# expected as a sibling of this build repo. family rk35xx.conf sets
# KERNELSOURCE to armbian/linux-rockchip rk-6.1-rkr7.2; this hook overrides
# it after family config so only this board is affected.
function post_family_config__microduck_kernel_source() {
	KERNELSOURCE="${SRC}/../linux-rockchip"
	KERNELBRANCH="branch:microduck-rk3566-6.1-rkr7.2"
}

# DKMS builds against the image kernel headers.
function post_family_config__microduck_install_kernel_headers() {
	declare -g INSTALL_HEADERS="yes"
}

# Install the WQ9201S driver from the Seeed APT repo, same flow as the
# reComputer RK3576 Module Dev Kit.
function post_install_kernel_debs__microduck_install_wq9201s() {
	display_alert "Installing WQ9201S WiFi/BT (DKMS, builds in chroot)" "wq9201s" "info"
	chroot_sdcard_apt_get_install gcc
	seeed_recomputer_install_from_apt wq9201s-wifi-bt-dkms
	if_error_find_files_sdcard+=("/var/lib/dkms/wq9201s*/*/build/*.log")

	# wq9201s-bt-attach hardcodes the devkit's ttyS4; MicroDuck BT is ttyS1
	sed -i "s|/dev/ttyS4|/dev/ttyS1|g" "${SDCARD}/usr/bin/wq9201s-bt-attach"

	display_alert "WQ9201S WiFi/BT installed" "wq9201s" "info"
}
